<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoempresa.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Planner</title>
    <script>
      (function () {
        var theme = localStorage.getItem('project-planner-theme') || 'dark';
        if (theme !== 'light' && theme !== 'dark' && theme !== 'midnight') {
          theme = 'dark';
        }
        document.documentElement.classList.add(theme);
      })();
    </script>

    <!-- Autodesk Platform Services Viewer v7 (LTS) — requerido para el visor 3D BIM -->
    <link
      rel="stylesheet"
      type="text/css"
      href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css"
    />
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>

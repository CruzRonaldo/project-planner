openapi: 3.0.3
info:
  title: Project Planner API
  version: 1.0.0
  description: |-
    Documentación interactiva de la API REST para el sistema Project Planner.

    Módulos incluidos:
    - Portafolio de Proyectos e Hitos Globales
    - Gestión Operativa y Tareas de Campo
    - Equipo Técnico, Áreas Especializadas y Roles
    - Autenticación y Monitoreo de Usuarios en Vivo
    - Integraciones: Make (Webhooks), Google Drive y Modelos 3D BIM (Autodesk APS)
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Endpoint de autenticación para verificar credenciales de usuario y rol.
        Actualiza la fecha de último inicio de sesión (last_login) en la Base de Datos.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Registra el cierre de sesión del usuario para marcarlo desconectado
        en la Base de Datos.
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/users-status/:
    get:
      operationId: auth_users_status_retrieve
      description: |-
        Retorna la lista de usuarios técnicos con su estado real de conexión (isOnline)
        calculado según su último inicio de sesión (last_login) en la Base de Datos.
        Permite además actualizar el rol de SubAdministrador (is_staff).
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_users_status_partial_update
      description: |-
        Retorna la lista de usuarios técnicos con su estado real de conexión (isOnline)
        calculado según su último inicio de sesión (last_login) en la Base de Datos.
        Permite además actualizar el rol de SubAdministrador (is_staff).
      tags:
      - auth
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/drive-links/:
    get:
      operationId: drive_links_list
      description: CRUD para enlaces de Google Drive.
      tags:
      - drive-links
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriveLink'
          description: ''
    post:
      operationId: drive_links_create
      description: CRUD para enlaces de Google Drive.
      tags:
      - drive-links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveLink'
          description: ''
  /api/drive-links/{id}/:
    get:
      operationId: drive_links_retrieve
      description: CRUD para enlaces de Google Drive.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Enlace de Drive.
        required: true
      tags:
      - drive-links
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveLink'
          description: ''
    put:
      operationId: drive_links_update
      description: CRUD para enlaces de Google Drive.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Enlace de Drive.
        required: true
      tags:
      - drive-links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DriveLinkRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveLink'
          description: ''
    patch:
      operationId: drive_links_partial_update
      description: CRUD para enlaces de Google Drive.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Enlace de Drive.
        required: true
      tags:
      - drive-links
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDriveLinkRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedDriveLinkRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDriveLinkRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriveLink'
          description: ''
    delete:
      operationId: drive_links_destroy
      description: CRUD para enlaces de Google Drive.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Enlace de Drive.
        required: true
      tags:
      - drive-links
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/integrations/aps/models/:
    get:
      operationId: integrations_aps_models_retrieve
      description: |-
        GET /api/integrations/aps/models/
        Lista los modelos BIM almacenados en la base de datos (Bóveda colaborativa).
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/integrations/aps/models/{id}/:
    patch:
      operationId: integrations_aps_models_partial_update
      description: |-
        PATCH /api/integrations/aps/models/<id>/
        Renombrar un modelo.
        DELETE /api/integrations/aps/models/<id>/
        Eliminar un modelo de la BD.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: integrations_aps_models_destroy
      description: |-
        PATCH /api/integrations/aps/models/<id>/
        Renombrar un modelo.
        DELETE /api/integrations/aps/models/<id>/
        Eliminar un modelo de la BD.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/integrations/aps/models/{id}/download/:
    get:
      operationId: integrations_aps_models_download_retrieve
      description: |-
        GET /api/integrations/aps/models/<id>/download/

        Devuelve una URL firmada de S3 para descargar el archivo original.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - integrations
      responses:
        '200':
          description: No response body
  /api/integrations/aps/status/:
    get:
      operationId: integrations_aps_status_retrieve
      description: |-
        GET /api/integrations/aps/status/
        Verifica silenciosamente si la conexión APS está activa probando el token.
        Retorna métricas para el dashboard.
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/integrations/aps/token/:
    get:
      operationId: integrations_aps_token_retrieve
      description: |-
        GET /api/integrations/aps/token/

        Genera un token de acceso de solo lectura para el Autodesk Viewer 3D.
        El scope 'viewables:read' es el mínimo necesario para que el Viewer
        pueda cargar modelos ya traducidos.

        El Client Secret NUNCA sale de este endpoint — el frontend solo
        recibe el access_token temporal (válido por 3600 s normalmente).
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/integrations/aps/upload/:
    post:
      operationId: integrations_aps_upload_create
      description: |-
        POST /api/integrations/aps/upload/
        Sube un archivo a Autodesk OSS, inicia traducción y guarda en Bóveda.
      tags:
      - integrations
      responses:
        '200':
          description: No response body
  /api/integrations/google-drive/callback/:

          description: No response body
  /api/integrations/make/test/:
    post:
      operationId: integrations_make_test_create
      description: |-
        Endpoint para probar la conectividad con Make.
        Puede recibir opcionalmente {"webhook_url": "https://hook.make.com/..."} en el body.
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/integrations/make/trigger/:
    post:
      operationId: integrations_make_trigger_create
      description: |-
        Dispara un evento arbitrario hacia Make.
        Body esperado:
        {
            "event": "project.alert",
            "data": { ... },
            "webhook_url": "opcional"
        }
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/integrations/make/webhook/:
    post:
      operationId: integrations_make_webhook_create
      description: |-
        Endpoint receptor para llamadas entrantes desde Make hacia Project Planner.
        Permite que un escenario de Make envíe actualizaciones o confirmaciones.
        Ejemplo de payload recibido desde Make:
        {
            "action": "update_budget",
            "project_id": 1,
            "new_budget": 150000.0,
            "notes": "Ajuste automático desde escenario de Make"
        }
      tags:
      - integrations
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body

components:
  schemas:
    DriveLink:
      type: object
      description: Serializador para los enlaces y archivos asociados en Google Drive
        vinculados a tareas
      properties:
        id:
          type: integer
          readOnly: true
        task:
          type: integer
          title: Tarea
        task_title:
          type: string
          title: TÃ­tulo de la Tarea
          readOnly: true
        project_id:
          type: integer
          title: Proyecto
          readOnly: true
        project_code:
          type: string
          title: CÃ³digo del Proyecto
          description: Ej. PRJ-2026-001
          readOnly: true
        title:
          type: string
          title: TÃ­tulo del Enlace
          maxLength: 200
        drive_url:
          type: string
          format: uri
          title: URL de Google Drive
          maxLength: 500
        file_id:
          type: string
          nullable: true
          title: Google Drive File/Folder ID
          maxLength: 150
        file_type:
          allOf:
          - $ref: '#/components/schemas/FileTypeEnum'
          title: Tipo de Archivo
        file_type_display:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - drive_url
      - file_type_display
      - id
      - project_code
      - project_id
      - task
      - task_title
      - title
    DriveLinkRequest:
      type: object
      description: Serializador para los enlaces y archivos asociados en Google Drive
        vinculados a tareas
      properties:
        task:
          type: integer
          title: Tarea
        title:
          type: string
          minLength: 1
          title: TÃ­tulo del Enlace
          maxLength: 200
        drive_url:
          type: string
          format: uri
          minLength: 1
          title: URL de Google Drive
          maxLength: 500
        file_id:
          type: string
          nullable: true
          title: Google Drive File/Folder ID
          maxLength: 150
        file_type:
          allOf:
          - $ref: '#/components/schemas/FileTypeEnum'
          title: Tipo de Archivo
      required:
      - drive_url
      - task
      - title
    FileTypeEnum:
      enum:
      - FOLDER
      - DOCUMENT
      - BIM_MODEL
      - RENDER_360
      - SPREADSHEET
      - OTHER
      type: string
      description: |-
        * `FOLDER` - Carpeta de Tarea / Entregable
        * `DOCUMENT` - Documento / EspecificaciÃ³n TÃ©cnica

name: Respaldo Diario Automatico PostgreSQL (8:00 AM)

on:
  schedule:
    # Ejecución automática diaria a las 08:00 UTC (03:00 AM UTC-5 hora Lima)
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Permite disparar el respaldo manualmente desde la consola de GitHub Actions

jobs:
  database_backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Configurar entorno Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar respaldo automático de PostgreSQL (Esquema public aislado)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-github-actions-backup-runner-temp-key' }}
        run: |
          python manage.py backup_database --source automatic

      - name: Preservar artefacto de respaldo en almacenamiento seguro de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: supabase-database-backup
          path: backups/project_planner_*.dump
          retention-days: 30
          if-no-files-found: warn
